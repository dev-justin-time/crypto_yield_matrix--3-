# Production deployment: Crypto Yield Matrix gateway + live-data worker
#
# Prerequisites (operator must complete before deployment):
#   1. Set BLOCKS_API_KEY in .env (never commit)
#   2. Set GATEWAY_CLIENT_KEYS=client_id=random_secret (min 16 chars)
#   3. Review GATEWAY_MAX_DAILY_SPEND_USD and GATEWAY_TASK_COST_USD
#   4. Place TLS certificate at /run/secrets/gateway_tls (or use external edge)
#   5. Deploy behind a TLS-terminating, rate-limited, authenticated reverse proxy
#
# Deployment:
#   docker compose up -d --build
#   docker compose ps
#   curl http://localhost:3000/health
#
# Emergency stop:
#   touch .gateway-state/PAUSE_PAID_TASKS
#   docker compose restart gateway

services:
  gateway:
    build:
      context: ./crypto_yield_matrix_node_gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"  # Private loopback only; expose through reverse proxy
    environment:
      NODE_ENV: production
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "3000"
      GATEWAY_ALLOW_PRIVATE_BIND: "true"
      GATEWAY_TASK_TIMEOUT_MS: "120000"
      GATEWAY_MAX_BODY_BYTES: "1000000"
      GATEWAY_MAX_QUESTION_CHARS: "4000"
      GATEWAY_MAX_ARTIFACT_BYTES: "5242880"
      GATEWAY_MAX_ARTIFACT_COUNT: "32"
      GATEWAY_MAX_CONCURRENT_TASKS: "8"
      GATEWAY_MAX_REQUESTS_PER_MINUTE: "30"
      GATEWAY_MAX_DAILY_TASKS: "100"
      GATEWAY_MAX_DAILY_SPEND_USD: "10"
      GATEWAY_TASK_COST_USD: "0.10"
      GATEWAY_BUDGET_STATE_FILE: "/app/.gateway-state/budget.json"
      GATEWAY_KILL_SWITCH_FILE: "/app/.gateway-state/PAUSE_PAID_TASKS"
      GATEWAY_RELEASE_ID: "${GATEWAY_RELEASE_ID:-unversioned}"
    env_file:
      - ./crypto_yield_matrix_node_gateway/.env  # Contains BLOCKS_API_KEY, GATEWAY_CLIENT_KEYS
    volumes:
      - gateway-budget:/app/.gateway-state  # Persistent budget ledger
      - ./yield_data.csv:/app/yield_data.csv:ro
      - ./asset_catalog.csv:/app/asset_catalog.csv:ro
      - ./live_data:/app/live_data:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const http = require('http');
          http.get('http://localhost:3000/health', (res) => {
            let data = '';
            res.on('data', (chunk) => data += chunk);
            res.on('end', () => {
              try { const body = JSON.parse(data); process.exit(body.status === 'ok' ? 0 : 1); }
              catch { process.exit(1); }
            });
          }).on('error', () => process.exit(1));
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  live-worker:
    build:
      context: .
      dockerfile: live_worker.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      LIVE_WORKER_CYCLE_SECONDS: "300"
      LIVE_WORKER_TIMEOUT_SECONDS: "15"
      LIVE_WORKER_MIRROR_DEPLOYMENTS: "0"
    volumes:
      - live-data:/app/live_data
      - ./yield_data.csv:/app/yield_data.csv:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json, pathlib, sys, time
          from datetime import datetime, timezone
          p = pathlib.Path('/app/live_data/worker_status.json')
          try:
            d = json.loads(p.read_text()) if p.exists() else {}
            t = datetime.fromisoformat(d.get('last_cycle_at', '1970-01-01T00:00:00+00:00').replace('Z','+00:00'))
            ok = d.get('liveness') == 'running' and (time.time() - t.timestamp()) < 1200
            sys.exit(0 if ok else 1)
          except Exception:
            sys.exit(1)
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gateway-budget:
    driver: local
  live-data:
    driver: local
