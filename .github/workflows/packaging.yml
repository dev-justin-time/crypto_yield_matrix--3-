name: packaging-integrity

on:
  push:
  pull_request:

jobs:
  source-and-package-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify card-generated adapters
        run: python generate_deployments.py --check
      - name: Verify native dependency pins
        run: python -c "from pathlib import Path; assert all('blocks-network==1.0.11' in p.read_text() for p in Path('blocks_deploy').glob('*/pyproject.toml'))"
      - name: Verify deterministic source mirrors
        run: python sync_deployments.py --check
      - name: Run no-spend scaffold and materialized-package tests
        run: python test_packaging.py
      - name: Validate Python syntax
        run: python -m compileall -q blocks_agents blocks_deploy test_packaging.py generate_deployments.py sync_deployments.py trigger_guarded.py
      - name: Validate gateway without paid dispatch
        working-directory: crypto_yield_matrix_node_gateway
        run: |
          npm ci
          npm run check
          npm run smoke
          npm run resilience
          npm run llm-smoke
