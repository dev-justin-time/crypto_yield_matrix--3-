# Prometheus alerting rules for Crypto Yield Matrix
#
# Apply with:
#   promtool check rules monitoring/alerting_rules.yml
#
# These rules are designed to be scraped by a Prometheus collector that
# authenticates to the gateway's /metrics/prometheus endpoint using a
# bearer token configured through the scrape target's authorization block.

groups:
  - name: crypto_yield_matrix_gateway
    interval: 30s
    rules:
      # ---- Liveness ----
      - alert: GatewayDown
        expr: up{job="crypto-yield-matrix-gateway"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Gateway is unreachable"
          description: "The gateway health endpoint has been down for 2 minutes. Check container status, network, and resource limits."

      # ---- Budget ----
      - alert: GatewayBudgetExhausted
        expr: gateway_budget_rejected_total > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Gateway daily budget exhausted"
          description: "Paid tasks are being rejected due to budget exhaustion. Verify spend, increase ceiling if approved, or investigate anomalous usage."

      - alert: GatewayBudgetNearExhaustion
        expr: rate(gateway_invoke_accepted_total[1h]) * 24 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gateway budget near daily limit"
          description: "Task acceptance rate suggests the daily budget ceiling will be reached before the next reset."

      # ---- Capacity ----
      - alert: GatewayCapacitySaturated
        expr: gateway_capacity_rejected_total > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Gateway paid-task capacity is full"
          description: "Requests are being rejected because maxConcurrentTasks is reached. Consider scaling provider runtimes or reducing load."

      # ---- Errors ----
      - alert: GatewayHigh5xxRate
        expr: rate(gateway_responses_total{status=~"5.."}[5m]) / rate(gateway_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High gateway 5xx error rate"
          description: "More than 5% of requests are returning 5xx errors. Check upstream Blocks connectivity, provider health, and gateway logs."

      - alert: GatewayTaskTimeoutRate
        expr: rate(gateway_task_timeouts_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gateway task timeouts detected"
          description: "Paid tasks are timing out. Check provider runtime health, task complexity, and timeout configuration."

      # ---- Authentication ----
      - alert: GatewayAuthAbuse
        expr: rate(gateway_auth_rejected_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated authentication rejection rate"
          description: "More than 10 auth rejections per minute. Investigate possible credential misuse or brute-force attempts."

      # ---- Live Worker ----
      - alert: LiveWorkerStale
        expr: time() - (last_cycle_at_timestamp or 0) > 1200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Live data worker is stale"
          description: "The live worker has not completed a cycle in over 20 minutes. Check worker container status, provider connectivity, and resource limits."

      - alert: LiveWorkerDegraded
        expr: data_readiness{state="degraded"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Live data worker is degraded"
          description: "Some providers are failing; live data may be incomplete. Check worker logs for provider errors."

      - alert: LiveWorkerNoFreshData
        expr: data_readiness{state="no_fresh_observation"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Live worker has no fresh observations"
          description: "All providers are failing. Live data is unavailable. Investigate immediately."
