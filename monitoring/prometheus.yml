# Internal collector contract for the gateway's authenticated Prometheus endpoint.
# This file is intentionally not a complete production deployment: inject the
# bearer credential through the collector's supported secret mechanism or use an
# internal metrics sidecar that authenticates to the gateway. Do not expose this
# target publicly and do not commit a live credential.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: crypto-yield-matrix-gateway
    metrics_path: /metrics/prometheus
    scheme: http
    static_configs:
      - targets: ['gateway:3000']
    # Configure authentication using the Prometheus version/platform's secret
    # injection mechanism. When GATEWAY_CLIENT_ORGS is configured, the collector
    # must also send X-Gateway-Organization for the metrics client mapping.
    # The exact secret-file/key syntax is deployment-specific; use a supported
    # authorization/http_config block or an internal authenticated sidecar.
    # Example concept only (not valid with literal placeholders):
    # authorization:
    #   type: Bearer
    #   credentials_file: /run/secrets/gateway_metrics_token
    # http_headers:
    #   X-Gateway-Organization:
    #     values: ['research_team']
