services:
  gateway:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # The container may bind its private Docker network only when the
      # explicit private-bind flag is true. Host publication remains loopback-only;
      # never expose this service directly to the Internet.
      GATEWAY_HOST: ${GATEWAY_HOST:-0.0.0.0}
      GATEWAY_ALLOW_PUBLIC_BIND: ${GATEWAY_ALLOW_PUBLIC_BIND:-false}
      GATEWAY_ALLOW_PRIVATE_BIND: ${GATEWAY_ALLOW_PRIVATE_BIND:-true}
      GATEWAY_PORT: 3000
      GATEWAY_RELEASE_ID: ${GATEWAY_RELEASE_ID:-compose-local}
      GATEWAY_BUDGET_STATE_FILE: /app/.gateway-state/budget.json
      GATEWAY_KILL_SWITCH_FILE: /app/.gateway-state/PAUSE_PAID_TASKS
      GATEWAY_MAX_ARTIFACT_BYTES: 5242880
      # Optional: bind gateway clients to organizations via the secret-managed .env.
      # GATEWAY_CLIENT_ORGS: research_app=research_team
      GATEWAY_MAX_ARTIFACT_COUNT: 32
    # The container binds on its private Docker network. Host access remains
    # loopback-only; expose it publicly only through a verified authenticated edge.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - gateway-budget:/app/.gateway-state
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/ready').then(r =>
          process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gateway-budget:
