services:
  gateway:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 3000
      GATEWAY_BUDGET_STATE_FILE: /app/.gateway-state/budget.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - gateway-budget:/app/.gateway-state
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/ready').then(r =>
          process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gateway-budget:
